# Validation on every pull request and every push to `main`
# (`infrastructure.md` §7.1, `phase-00-foundations.md` P0-29).
#
# Four jobs, deliberately parallel. They share nothing but the pnpm store cache, so a slow
# integration run does not delay the answer on a lint error, and a failure names the job it
# came from rather than being one red X on a twelve-step script.
#
# **No AWS credentials anywhere in this workflow.** §7.1's snippet gives `synth` an OIDC role
# and runs `cdk diff`; P0-29 changes that on purpose. There is nothing deployed to diff
# against until Phase 4, and a job that needs credentials is a job that cannot run on a fork
# PR. Phase 4 adds the credentialled `cdk diff` step and its `id-token: write` permission
# back.
name: ci

on:
  pull_request:
  push:
    branches: [main]

# Cancel superseded runs on the same ref. Safe here because nothing in this workflow
# deploys; `deploy-dev.yml` deliberately does the opposite from Phase 4 (§7.2), because a
# cancelled CloudFormation update leaves a stack in UPDATE_IN_PROGRESS.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    name: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # gitleaks scans history, and a shallow clone gives it one commit to look at.
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Cache turbo
        uses: actions/cache@v4
        with:
          path: node_modules/.cache/turbo
          key: ${{ runner.os }}-turbo-${{ github.sha }}
          restore-keys: ${{ runner.os }}-turbo-

      - run: pnpm install --frozen-lockfile

      # Before anything expensive: if the runner's Node disagrees with what the repository
      # declares, every result after this point describes the wrong runtime.
      - name: Node versions agree
        run: node scripts/check-node-versions.mjs

      # Dependency versions agree across workspaces. `syncpack` was installed in P0-06 and
      # ran nowhere until P1-31 — the roadmap's R4 mitigation claimed it ran from Phase 0,
      # and it did not. It is wired up here because P1-31 creates the second copy of React
      # it exists to police: `packages/ui` now declares `react` and `react-native` alongside
      # `apps/mobile`, and a drift between them produces invalid-hook-call errors that cost
      # a day to diagnose (`tech-stack.md` §2.5).
      - name: Dependency versions agree
        run: pnpm run check:versions

      # `biome ci`, not `biome check` — it never writes, and it annotates the diff.
      - name: Lint and format
        run: pnpm exec biome ci .

      - name: Typecheck
        run: pnpm turbo run typecheck

      # `e2e/` is deliberately not a pnpm workspace, so `turbo run typecheck` cannot see it and
      # the Playwright harness would otherwise be the only unchecked TypeScript in the
      # repository — the hole both `tsconfig.test.json` files exist to close (P1-29).
      - name: Typecheck the E2E harness
        run: pnpm run typecheck:e2e

      # Coverage thresholds live in each package's vitest config and are gates, not
      # reports (`testing.md` §9). `--coverage` is what arms them.
      - name: Unit tests with coverage gates
        run: pnpm turbo run test -- --coverage

      # Regenerates the spec and fails on a diff, so it cannot drift from the schemas.
      - name: OpenAPI document is current
        run: pnpm run gen:openapi:check

      # Synthesises and measures the real Lambda artifact against the 5 MB budget.
      - name: Lambda bundle size
        run: pnpm run check:bundle-size

      # `expo-doctor` is not on the workspace PATH — it is published as its own package and
      # run through npx. Found the hard way in P0-22.
      - name: Expo project health
        run: npx --yes expo-doctor@latest
        working-directory: apps/mobile

      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage
          path: '**/coverage/**'
          if-no-files-found: ignore

  # The architectural rules from `repo-structure.md` §3 and §4. Its own job so that a
  # forbidden import is reported as a forbidden import, not as "validate failed".
  depcruise:
    name: depcruise
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Import rules
        run: pnpm depcruise

      # One step per rule, so the failure names the rule that broke rather than reporting
      # that something, somewhere, matched (`repo-structure.md` §4).
      - name: No Scan in application code
        run: node scripts/check-forbidden.mjs no-scan
      - name: AUTH_MODE stays in config.ts and identity.ts
        run: node scripts/check-forbidden.mjs auth-mode-containment
      - name: No raw key literals outside the repository layer
        run: node scripts/check-forbidden.mjs no-key-literals
      - name: No dangerouslySetInnerHTML
        run: node scripts/check-forbidden.mjs no-dangerous-html
      - name: Client layer rules
        run: node scripts/check-forbidden.mjs client-layer-rules
      # The three rules added after this job was first written. They ran only in `pnpm
      # verify`, which no CI job invokes — so each was enforced on a developer's machine and
      # nowhere else, which is the silent-green split this file exists to avoid. P3-07 adds
      # the last of them and wires up all three rather than leaving two dead guards beside
      # the one it needs.
      - name: No unresolved passed-plan count in the client
        run: node scripts/check-forbidden.mjs no-passed-plan-count
      - name: LIST_TEMPLATES stays creation-time data
        run: node scripts/check-forbidden.mjs list-templates-are-creation-data
      - name: No template suggester
        run: node scripts/check-forbidden.mjs no-template-suggester

  # DynamoDB Local. Separate from `validate` so that `pnpm test` stays runnable with nothing
  # but Node, and a Docker problem cannot be mistaken for a failing unit test.
  integration:
    name: integration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # The same preflight `pnpm dev` runs (P0-23): starts the containers, waits for :8000,
      # builds `@od/shared`, creates the table from the shared definition and copies
      # `.env.example`. Reusing it means CI exercises the path a new developer takes, and
      # the wait-for-ready logic has one home.
      - name: Start DynamoDB Local and create the table
        run: node scripts/dev-preflight.mjs

      - name: Integration tests
        run: pnpm --filter @od/api test:int

  # The Playwright flow, against the local stack (P1-29). Its own job for the same reason
  # `integration` is: a browser failure should report as `e2e`, not as step eleven of
  # `validate`, and it needs Docker and a browser download that the other jobs do not.
  #
  # `testing.md` §6.1 describes running this against the deployed dev site. That is Phase 4
  # (P4-14) and there is nothing deployed yet; `E2E_BASE_URL` is what re-aims it on the day
  # there is, without this job changing shape.
  e2e:
    name: e2e
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # Chromium only. WebKit is run locally before a release (`testing.md` §6.1), not on
      # every PR — three browsers is three downloads for one flow's worth of signal.
      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      # The containers and the shared build. The harness creates and seeds its **own** table
      # (`od-main-e2e`), so this is here for DynamoDB Local itself.
      - name: Start DynamoDB Local
        run: node scripts/dev-preflight.mjs

      # Builds the web export, then runs the flow against it.
      - name: Web E2E
        run: pnpm run e2e:web

      - name: Flag pass-on-retry results
        if: always() && hashFiles('playwright-results.json') != ''
        run: node e2e/report-flakes.mjs

      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            playwright-results.json
          retention-days: 7

  # Eight stacks synthesised with no AWS credentials. This is also a build check: the
  # NodeLambda construct runs esbuild at synth time, so a runtime-invalid import that `tsc`
  # allowed through fails here. Do not "speed it up" by stubbing the bundling — in a phase
  # with no deploy that is most of the job's value.
  synth:
    name: synth
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: cdk synth (no credentials)
        run: pnpm --filter @od/infra exec cdk synth 'od-*-dev' --quiet
