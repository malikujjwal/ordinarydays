# Local backing services. See docs/02-architecture/infrastructure.md §6.1.
services:
  dynamodb:
    image: amazon/dynamodb-local:latest
    command: ["-jar", "DynamoDBLocal.jar", "-sharedDb", "-dbPath", "./data"]
    ports: ["8000:8000"]
    volumes: ["./.dynamodb-data:/home/dynamodblocal/data"]
    working_dir: /home/dynamodblocal
  # Disposable integration-test database. The profile keeps it out of `pnpm dev`; tests do
  # not need persistence, and -inMemory avoids SQLite writes over Docker Desktop's bind mount.
  dynamodb-test:
    profiles: ["test"]
    image: amazon/dynamodb-local:latest
    command: ["-jar", "DynamoDBLocal.jar", "-sharedDb", "-inMemory"]
    ports: ["8002:8000"]
    healthcheck:
      # An unsigned request returns 400; curl success still proves the listener is ready.
      test: ["CMD", "curl", "--silent", "--output", "/dev/null", "http://localhost:8000"]
      interval: 2s
      timeout: 2s
      retries: 15
  dynamodb-admin:
    image: aaronshaf/dynamodb-admin
    ports: ["8001:8001"]
    environment:
      DYNAMO_ENDPOINT: http://dynamodb:8000
      AWS_REGION: us-east-1
    depends_on: [dynamodb]
  # The local media bucket (P3-21), the first consumer of object storage. MinIO speaks the
  # S3 API including SigV4 presigned PUT, so the attachment path is @aws-sdk/client-s3 either
  # way and only the endpoint and credentials differ. `pnpm --filter @od/api s3:create-bucket`
  # creates `od-media-local` in it, idempotently, and allows anonymous reads on its `u/`
  # prefix — the local stand-in for the Phase 5 media distribution the app reads by key.
  #
  # It models no part of CloudFront, OAC or Block Public Access; those are properties of the
  # deployed bucket, asserted by the CDK tests.
  minio:
    image: minio/minio:latest
    command: ["server", "/data", "--console-address", ":9001"]
    ports: ["9000:9000", "9001:9001"]
    environment:
      MINIO_ROOT_USER: local
      MINIO_ROOT_PASSWORD: localsecret
    volumes: ["./.minio-data:/data"]
