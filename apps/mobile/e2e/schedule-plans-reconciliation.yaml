appId: app.ordinarydays.ios.local
name: P3 native schedule reconciles Plans
jsEngine: graaljs
tags: [p3, ios, release, reconciliation]
onFlowStart:
  - runScript:
      file: scripts/setup.js
      env:
        FLOW: schedule-plans-reconciliation
onFlowComplete:
  - runScript: scripts/cleanup.js
---
- launchApp:
    clearState: true
- tapOn: "Plans, tab, .*"
- assertVisible:
    id: ${'plans-date-' + output.today}
- assertVisible: ${output.planTitle}
- tapOn:
    id: ${'agenda-row-' + output.activityId}
- assertVisible:
    id: detail-content
- tapOn:
    id: when-where-date
- assertVisible:
    id: reschedule-sheet
- tapOn: Set a time
- scrollUntilVisible:
    element:
      text: Done
    direction: DOWN
- tapOn: Done
- assertNotVisible:
    id: reschedule-sheet
- tapOn:
    id: detail-back
- assertVisible:
    id: ${'plans-date-' + output.today}
- assertVisible: ${output.planTitle}
- assertVisible: 9:00 AM, change time
