appId: app.ordinarydays.ios.local
name: P3 native Plans reflects local creates and completion
jsEngine: graaljs
tags: [p3, plans, ios, release, reconciliation]
onFlowStart:
  - runScript:
      file: scripts/setup.js
      env:
        FLOW: plans-live-projection
onFlowComplete:
  - runScript: scripts/cleanup.js
---
- launchApp:
    clearState: true
- assertVisible:
    id: today-screen
- tapOn:
    id: global-add
- assertVisible:
    id: object-chooser
- tapOn:
    id: compose-title
- inputText: ${output.title}
- tapOn:
    id: object-choice-task
- assertVisible:
    id: compose-form
- tapOn:
    text: Today
- tapOn:
    id: compose-save
- assertVisible: ${output.title}
- tapOn: "Plans, tab, .*"
- assertVisible: ${output.title + ', not completed'}
- tapOn: ${output.title + ', not completed'}
- assertVisible: ${output.title + ', completed'}
- tapOn: ${output.title + ', completed'}
- assertVisible: ${output.title + ', not completed'}
- tapOn:
    id: ${'agenda-row-' + output.planId}
- assertVisible:
    id: detail-content
- tapOn:
    id: detail-complete
- assertVisible:
    id: detail-undo
- tapOn:
    id: detail-back
- assertVisible: ${output.planTitle + ', Done, .*'}
- tapOn: ${output.planTitle}
- assertVisible:
    id: detail-undo
- tapOn:
    id: detail-undo
- assertVisible:
    id: detail-complete
- tapOn:
    id: detail-back
- assertNotVisible: ${output.planTitle + ', Done, .*'}
- assertVisible: ${output.planTitle}
