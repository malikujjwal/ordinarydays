# Choose Task in global Add, save it, and see it in the flat activity list (P1-29).
#
# The iOS half of `e2e/specs/create-activity.spec.ts`, asserting the same two things in the
# same order. It is deliberately the same flow rather than a different one: the point of
# running it on a simulator is the platform, not extra coverage.
#
#   maestro test apps/mobile/e2e/add-task.yaml
#
# ## It asserts on accessibility labels, not on coordinates
#
# `testing.md` §6.2: the labels are the ones `interaction-contract.md` §6.2 specifies, so a
# flow breaking usually means a label regressed — which is itself worth knowing. `id:` matches
# the `testID` props the components already carry, and the visible copy is matched as text
# where the copy is the contract (`Task`, `Tomorrow`, `Save task`).
#
# ## No sign-in
#
# There is nothing to sign in to: `AUTH_MODE=local` resolves every request as `usr_local_dev`
# for the whole of Phases 1–3. Phase 4 prepends a sign-in step directly after `launchApp` and
# nothing below it moves.
#
# ## It needs the API and a seeded table
#
#   docker compose up -d
#   pnpm --filter @od/api dev          # :3000
#   pnpm seed:local
#
# On a simulator `localhost` is the host machine, so the default `http://localhost:3000` from
# `app.config.ts` is reachable as-is. On a physical device it is not — `apiClient.ts` rewrites
# to the LAN host Metro served from, which is why the device run must go through Metro.
#
# The `local` profile's identifier from `app.config.ts`. `dev` and `prod` install alongside it
# with their own, which is the point of the suffix — it is never ambiguous which app a flow
# just drove.
appId: app.ordinarydays.ios.local
---
- launchApp:
    clearState: true

# Plans — the flat activity list. Today is a Phase 2 placeholder and shows nothing.
# Tapped by its accessible name, which is the tab's own label (`Today · Plans · Lists`), not a
# testID: these three labels are the product's user-facing vocabulary and a flow that stopped
# noticing a change to them would be missing the regression most worth catching.
- tapOn: 'Plans'
- assertVisible:
    id: 'plans-screen'

# The global +. It has one job and takes no target: there is no path from here to a
# preselected form (`activities.md` §2.1).
- tapOn:
    id: 'global-add'

# Assertion 1: the chooser comes first, and there is no title field yet — so there is no text
# for anything to classify (`CLAUDE.md` rule 2).
- assertVisible:
    id: 'object-chooser'
- assertNotVisible:
    id: 'compose-title'

- tapOn:
    id: 'object-choice-task'
- assertVisible:
    id: 'compose-form'

# A title that reads like an Outing or a Meal, saved as the Task the user actually chose.
- tapOn:
    id: 'compose-title'
- inputText: 'Dinner at Zahav'

# `Tomorrow`, not `Today`: the row has to land in `#S` from today forward for the `upcoming`
# stage to return it, and a full day of margin means a run at 23:59 is not a different test.
- tapOn: 'Tomorrow'

- tapOn:
    id: 'compose-save'

# Back on Plans, with the new row in it.
- assertVisible:
    id: 'plans-screen'
- assertVisible: 'Dinner at Zahav'

# Assertion 2: the plan-sounding title is a Task, said in the header's own words.
- tapOn: 'Dinner at Zahav'
- assertVisible:
    id: 'detail-title'
- assertVisible: 'Task'
