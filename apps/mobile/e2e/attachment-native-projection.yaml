appId: app.ordinarydays.ios.local
name: P3 native attachment projection survives relaunch
jsEngine: graaljs
tags: [p3, ios, release, reconciliation, attachments]
onFlowStart:
  - runScript:
      file: scripts/setup.js
      env:
        FLOW: attachment-native-projection
onFlowComplete:
  - runScript: scripts/cleanup.js
---
- addMedia:
    - ../../../e2e/visual-specs/snapshots/lists-contract.spec.ts/create-compact-light.png
- launchApp:
    clearState: true
- assertVisible:
    id: today-screen
- runFlow:
    when:
      notVisible:
        id: agenda-row-body
        text: ${output.planTitle + ',.*'}
    commands:
      - scrollUntilVisible:
          element:
            id: agenda-row-body
            text: ${output.planTitle + ',.*'}
          direction: DOWN
          centerElement: true
- tapOn:
    id: agenda-row-body
    text: ${output.planTitle + ',.*'}
- assertVisible:
    id: detail-content
- scrollUntilVisible:
    element:
      id: add-to-plan-photo
    direction: DOWN
    centerElement: true
- tapOn:
    id: add-to-plan-photo
- assertVisible:
    id: attachment-sheet
- tapOn:
    id: attachment-picker-photos
# Single-selection PHPicker returns immediately after choosing the imported image.
- tapOn:
    text: "Photo, [^,]+, [^,]+"
    index: 0
- assertVisible: Added
- tapOn:
    id: attachment-sheet-done
- scrollUntilVisible:
    element:
      id: section-attachments
    direction: DOWN
    centerElement: true
- assertVisible:
    id: section-attachments
- assertVisible: Photo 1 of 1
- tapOn: Photo 1 of 1
- assertVisible:
    id: attachment-viewer-pager
- tapOn:
    id: attachment-viewer-close
- assertNotVisible:
    id: attachment-viewer-pager
- pressKey: home
- killApp
- launchApp:
    stopApp: false
- runFlow:
    when:
      notVisible:
        id: agenda-row-body
        text: ${output.planTitle + ',.*'}
    commands:
      - scrollUntilVisible:
          element:
            id: agenda-row-body
            text: ${output.planTitle + ',.*'}
          direction: DOWN
          centerElement: true
- tapOn:
    id: agenda-row-body
    text: ${output.planTitle + ',.*'}
- scrollUntilVisible:
    element:
      id: section-attachments
    direction: DOWN
    centerElement: true
- assertVisible:
    id: section-attachments
- assertVisible: Photo 1 of 1
- longPressOn:
    text: Photo 1 of 1
- assertVisible:
    id: attachment-actions
- tapOn:
    id: attachment-delete
- assertVisible:
    id: attachment-delete-confirm
- tapOn:
    id: confirm-accept
- assertNotVisible: Photo 1 of 1
- pressKey: home
- killApp
- launchApp:
    stopApp: false
- runFlow:
    when:
      notVisible:
        id: agenda-row-body
        text: ${output.planTitle + ',.*'}
    commands:
      - scrollUntilVisible:
          element:
            id: agenda-row-body
            text: ${output.planTitle + ',.*'}
          direction: DOWN
          centerElement: true
- tapOn:
    id: agenda-row-body
    text: ${output.planTitle + ',.*'}
- assertVisible:
    id: detail-content
- scrollUntilVisible:
    element:
      id: add-to-plan-photo
    direction: DOWN
    centerElement: true
- assertVisible:
    id: add-to-plan-photo
- assertNotVisible: Photo 1 of 1

- assertVisible:
    id: add-to-plan-prep-task
- assertVisible:
    id: add-to-plan-list
- takeScreenshot: plan-add-actions
