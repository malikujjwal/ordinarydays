appId: app.ordinarydays.ios.local
name: P3 native Prep parent reconciliation
jsEngine: graaljs
tags: [p3, ios, release, reconciliation]
onFlowStart:
  - runScript:
      file: scripts/setup.js
      env:
        FLOW: prep-parent-reconciliation
onFlowComplete:
  - runScript: scripts/cleanup.js
---
- launchApp:
    clearState: true
- assertVisible:
    id: today-screen
- runFlow:
    when:
      notVisible:
        id: agenda-row-body
        text: ${output.planTitle + ',.*'}
    commands:
      - scrollUntilVisible:
          element:
            id: agenda-row-body
            text: ${output.planTitle + ',.*'}
          direction: DOWN
          centerElement: true
- tapOn:
    id: agenda-row-body
    text: ${output.planTitle + ',.*'}
- assertVisible:
    id: detail-content
- scrollUntilVisible:
    element:
      text: ${output.planTitle}
    direction: DOWN
    centerElement: true
- scrollUntilVisible:
    element:
      id: add-to-plan-prep-task
    direction: DOWN
    centerElement: true
- tapOn:
    id: add-to-plan-prep-task
- assertVisible:
    id: compose-form
- tapOn:
    id: compose-title
- inputText: ${output.prepTitle}
- tapOn:
    id: compose-save
- assertVisible:
    id: section-prep
- assertVisible: ${output.prepTitle}
