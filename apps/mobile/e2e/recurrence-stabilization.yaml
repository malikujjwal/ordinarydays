appId: app.ordinarydays.ios.local
name: P2-55 completing today leaves tomorrow's recurring occurrence live
jsEngine: graaljs
tags: [p2-55, ios, release]
env:
  API_BASE_URL: http://127.0.0.1:3000
  PROXY_CONTROL_URL: http://127.0.0.1:8474
onFlowStart:
  - runScript:
      file: scripts/setup.js
      env:
        FLOW: recurrence-stabilization
onFlowComplete:
  - runScript: scripts/cleanup.js
---
- launchApp:
    clearState: true
- assertVisible: ${output.title}
- assertVisible: ${output.title + ", .*Daily"}
- tapOn: "Plans, tab, .*"
- assertVisible:
    id: ${'plans-date-' + output.today}
- assertVisible:
    id: ${'plans-date-' + output.tomorrow}
- tapOn:
    text: ${output.title}
    above:
      id: ${'plans-date-' + output.tomorrow}
- assertVisible:
    id: detail-complete
- tapOn:
    id: detail-complete
- assertVisible:
    id: detail-undo
- tapOn:
    id: detail-back
- assertVisible:
    id: ${'plans-date-' + output.tomorrow}
- assertVisible:
    text: ${output.title + ', not completed'}
    below:
      text: ${'[A-Z]{3}, [A-Z]{3} ' + Number(output.tomorrow.slice(8))}
    above:
      id: ${'plans-date-' + new Date(Date.parse(output.tomorrow) + 86400000).toISOString().slice(0, 10)}
