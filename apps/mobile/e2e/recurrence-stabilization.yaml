appId: app.ordinarydays.ios.local
name: P2-55 completing today leaves tomorrow's recurring occurrence live
jsEngine: graaljs
tags: [p2-55, ios, release]
onFlowStart:
  - runScript:
      file: scripts/setup.js
      env:
        FLOW: recurrence-stabilization
onFlowComplete:
  - runScript: scripts/cleanup.js
---
- launchApp:
    clearState: true
- assertVisible: ${output.title}
- assertVisible: ${output.title + ", .*Daily"}
- tapOn: "Plans, tab, .*"
- assertVisible:
    id: ${'plans-date-' + output.today}
- scrollUntilVisible:
    element:
      text: ${output.title}
      childOf:
        id: ${'plans-day-' + output.today}
    direction: DOWN
- tapOn:
    text: ${output.title}
    childOf:
      id: ${'plans-day-' + output.today}
- assertVisible:
    id: detail-complete
- tapOn:
    id: detail-complete
- assertVisible:
    id: detail-undo
- tapOn:
    id: detail-back
- tapOn:
    id: ${'calendar-cell-' + output.tomorrow}
- scrollUntilVisible:
    element:
      text: ${output.title + ', not completed'}
      childOf:
        id: ${'plans-day-' + output.tomorrow}
    direction: DOWN
- assertVisible:
    text: ${output.title + ', not completed'}
    childOf:
      id: ${'plans-day-' + output.tomorrow}
