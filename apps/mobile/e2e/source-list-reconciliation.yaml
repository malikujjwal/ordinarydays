appId: app.ordinarydays.ios.local
name: P3 native source List reconciliation
jsEngine: graaljs
tags: [p3, ios, release, reconciliation]
env:
  API_BASE_URL: http://127.0.0.1:3000
  PROXY_CONTROL_URL: http://127.0.0.1:8474
onFlowStart:
  - runScript:
      file: scripts/setup.js
      env:
        FLOW: source-list-reconciliation
onFlowComplete:
  - runScript: scripts/cleanup.js
---
- launchApp:
    clearState: true
- assertVisible:
    id: today-screen
- tapOn: Lists
- assertVisible:
    id: lists-screen
- assertVisible: ${output.indexListTitle}
- swipe:
    from:
      id: ${'swipeable-list-' + output.indexListId}
    direction: LEFT
- tapOn:
    id: list-swipe-delete
- assertVisible:
    id: list-delete-confirm
- tapOn:
    id: confirm-accept
- assertNotVisible: ${output.indexListTitle}
- tapOn: Today
- assertVisible:
    id: today-screen
- assertVisible: ${output.planTitle}
- tapOn:
    id: ${'agenda-row-' + output.activityId}
- assertVisible:
    id: detail-content
- tapOn:
    id: add-to-plan-list
- assertVisible:
    id: list-style-chooser
- tapOn:
    id: list-style-checklist
- assertVisible:
    id: new-list-title-step
- tapOn:
    id: new-list-title
- eraseText
- inputText: ${output.listTitle}
- tapOn:
    id: new-list-create
- assertVisible:
    id: section-lists
- assertVisible: ${output.listTitle}
- tapOn: ${output.listTitle}
- assertVisible:
    id: list-detail
- tapOn: Add item
- tapOn:
    id: list-contextual-add-title
- inputText: Passport
- tapOn:
    id: list-contextual-add-commit
- assertVisible: Passport
- tapOn:
    id: list-detail-back
- assertVisible: 1 item
- tapOn: ${output.listTitle}
- assertVisible:
    id: list-detail
- tapOn:
    id: list-detail-menu
- assertVisible:
    id: list-header-menu
- tapOn:
    id: list-settings-open
- assertVisible:
    id: list-settings
- tapOn: Close
- assertNotVisible:
    id: list-settings
- tapOn:
    id: list-detail-menu
- assertVisible:
    id: list-header-menu
- tapOn:
    id: list-delete
- assertVisible:
    id: list-delete-confirm
- tapOn:
    id: confirm-accept
- assertVisible:
    id: detail-content
- assertNotVisible: ${output.listTitle}
