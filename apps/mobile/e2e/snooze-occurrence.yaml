appId: app.ordinarydays.ios.local
name: P2-37 snooze one recurring occurrence
jsEngine: graaljs
tags: [p2-37, ios, release]
env:
  API_BASE_URL: http://127.0.0.1:3000
  PROXY_CONTROL_URL: http://127.0.0.1:8474
onFlowStart:
  - runScript:
      file: scripts/setup.js
      env:
        FLOW: snooze-occurrence
onFlowComplete:
  - runScript: scripts/capture-snooze.js
  - runScript: scripts/cleanup.js
---
- launchApp:
    clearState: true
- assertVisible: ${output.title}
- swipe:
    from:
      id: ${'swipeable-row-' + output.activityId}
    direction: LEFT
- waitForAnimationToEnd
- tapOn:
    id: agenda-swipe-snooze
- assertVisible:
    id: snooze-sheet
- tapOn:
    id: snooze-minutes15
- assertVisible: ${output.title + ', .*Snoozed from ' + output.originalTimeLabel + ' to ' + output.snoozeTimeLabel}
- assertVisible: ${output.title + ', not completed'}
- tapOn: ${output.title}
- assertVisible:
    id: detail-title
- assertVisible:
    id: when-where-date
- assertVisible: ${'.*' + output.snoozeTimeLabel + '.*'}
- assertVisible:
    id: detail-edit-recurrence
- assertVisible: Repeat, Daily
- tapOn:
    id: detail-back
- tapOn: "Plans, tab, .*"
- assertVisible:
    id: ${'plans-date-' + output.today}
- assertVisible:
    text: ${output.snoozeTimeLabel + ', change time'}
    above:
      id: ${'plans-date-' + output.tomorrow}
- tapOn:
    id: ${'calendar-cell-' + output.tomorrow}
- scrollUntilVisible:
    element:
      text: ${output.title + ', ' + output.originalTimeLabel + ', Daily'}
      childOf:
        id: ${'plans-day-' + output.tomorrow}
    direction: DOWN
- assertVisible:
    text: ${output.title + ', ' + output.originalTimeLabel + ', Daily'}
    childOf:
      id: ${'plans-day-' + output.tomorrow}
