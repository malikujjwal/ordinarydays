appId: app.ordinarydays.ios.local
name: P2-37 add and complete
jsEngine: graaljs
tags: [p2-37, ios, release]
onFlowStart:
  - runScript:
      file: scripts/setup.js
      env:
        FLOW: add-and-complete
onFlowComplete:
  - runScript: scripts/cleanup.js
---
- launchApp:
    clearState: true
- assertVisible:
    id: today-screen
- tapOn:
    id: global-add
- assertVisible:
    id: object-chooser
- tapOn:
    id: compose-title
- inputText: ${output.title}
- tapOn:
    id: object-choice-task
- assertVisible:
    id: compose-form
- tapOn:
    text: Today
- tapOn:
    id: compose-save
- assertVisible: ${output.title}
- tapOn: ${output.title + ', not completed'}
- tapOn:
    id: today-earlier-toggle
- assertVisible: ${output.title + ', completed'}
